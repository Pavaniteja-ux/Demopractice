version: 2

models:
  - name: fct_sales

    columns:
      - name: sales_amount
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "coalesce(sales_amount, 0) >= 0"

      - name: unit_price_discount_pct
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "coalesce(unit_price_discount_pct, 0) between 0 and 1"